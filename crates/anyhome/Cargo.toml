[package]
name = "anyhome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "anyhome"
path = "src/lib.rs"

[[bin]]
name = "anyhome"
path = "src/main.rs"

[features]
# Real semantic embedder via local ONNX (all-MiniLM-L6-v2, dim 384). Off by
# default so the build stays dependency-light and network-free; opt in with
# `--features embed-fastembed`. The model is fetched once (HuggingFace) and
# cached; see scripts/fetch-model.sh for an offline/mirror prefetch.
default = []
embed-fastembed = ["dep:fastembed"]

[dependencies]
nfsserve.workspace = true
libsql.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
async-trait.workspace = true
# Real semantic embedder (local ONNX). Optional to keep the default build lean.
fastembed = { version = "4", optional = true }
# MSRV pin: libsql-ffi pulls bindgen -> which -> home v0.5.12 (needs Rust 1.88).
# We build on 1.85.0 (pinned via rust-toolchain.toml), so force a compatible home.
home = "=0.5.9"

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
